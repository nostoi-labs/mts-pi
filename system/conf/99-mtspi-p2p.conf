[keyfile]
# Wi-Fi Direct to the bike is handled by mtspi-p2p.service (dedicated wpa_supplicant) and by the bridge.
# mtspi-wifi-mode takes wlan0 away from NetworkManager and gives it back (bike/home). NetworkManager must never
# touch the P2P interfaces: it adopted the freshly formed group and removed it.
unmanaged-devices=interface-name:p2p-dev-wlan0;interface-name:p2p-wlan0-*
