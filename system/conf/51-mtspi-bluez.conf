# The Pi is a receiver for the iPhone (a2dp_sink, hfp_hf) and a phone for the bike (a2dp_source, hfp_ag).
# Calls are handled by oFono: the iPhone becomes the "modem" and its state is offered to the bike as a phone.
monitor.bluez.properties = {
  # a2dp_source: the Pi is the bike's phone; without it the Music button of the dashboard stays grey
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag ]
  bluez5.hfphsp-backend = "ofono"
  bluez5.codecs = [ sbc sbc_xq aac ]
  # narrowband voice (CVSD): wideband mSBC on the Pi 3 arrived crackling
  bluez5.enable-msbc = false
}

# Headless Pi (sessions without a seat, linger): WirePlumber 0.5 turns Bluetooth off if it sees no active seat.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

# Call audio (the HFP nodes of the hands-free link to the iPhone) is carried to the bike by our own SCO bridge
# (mtspi/hfp_ag.py): WirePlumber must not link it by itself to the default output, otherwise the radio
# carries music and voice to the bike at the same time.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_input.*", api.bluez5.profile = "~headset-.*" }
      { node.name = "~bluez_output.*", api.bluez5.profile = "~headset-.*" }
    ]
    actions = { update-props = { node.autoconnect = false } }
  }
]
