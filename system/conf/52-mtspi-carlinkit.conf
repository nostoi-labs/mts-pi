# With the Carlinkit (CARLINKIT=usb) the iPhone's music and voice go through CarPlay: the Pi must NOT present
# itself to the iPhone as a headset (A2DP sink) or as a hands-free unit with audio (HFP HF). Otherwise the iPhone
# sometimes picks the Pi as its output instead of CarPlay, and CarPlay delivers silence.
# oFono stays (call state, number, phonebook): without PipeWire's audio agent the iPhone's SCO link is refused.
# install.sh installs this file only with CARLINKIT=usb; it loads after 51-mtspi-bluez.conf. In WirePlumber 0.5
# lists from later files are APPENDED: replacing them needs "override." and then the whole section again.
override.monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source ]
  # no HFP backend: with "ofono" PipeWire still registers its audio agent with oFono and the iPhone's SCO link
  # is accepted. Voice to the bike is carried by our own bridge (mtspi/hfp_ag.py), not by PipeWire.
  bluez5.hfphsp-backend = "none"
  bluez5.codecs = [ sbc sbc_xq aac ]
  bluez5.enable-msbc = false
}
