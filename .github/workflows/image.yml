name: SD card image

# Builds the ready-to-flash image. Manually (the image goes to a draft release named after the version),
# or when a version tag v* is pushed (the image is attached to that release).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label of the image"
        default: "test"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          sudo apt-get update -q && sudo apt-get install -y -q parted e2fsprogs xz-utils
          sudo image/build.sh "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('image-{0}', env.VERSION) }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --prerelease --title "MTS Pi image $VERSION" --notes "SD card image built from commit ${{ github.sha }}."
          gh release upload "$TAG" out/* --clobber
